<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Redirect</title>
</head>
<style>
    table, th, td {
        border: 1px solid black;
        border-collapse: collapse;
    }
    th, td {
        min-width: 200px;
    }
</style>
<body>
    <div id="urls">
        <a href="{{ url_for('create') }}">Create</a>
        <p>Existing Redirects</p>
        <table>
            <thead>
                <tr>
                    <th scope="col">id</th>
                    <th scope="col">shortname</th>
                    <th scope="col">url</th>
                </tr>
            </thead>
            <tbody>
                {% for entry in lonks %}
                <tr>
                    <td>{{ entry.id }}</td>
                    <td>{{ entry.shortname }}</td>
                    <td><a href="{{ entry.url }}">{{ entry.url }}</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
