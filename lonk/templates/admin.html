<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Redirect</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, td {
            min-width: 200px;
        }
        #urls {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #href-new {
            padding: 1px 6px;
            border: 1px outset buttonborder;
            border-radius: 3px;
            color: buttontext;
            background-color: buttonface;
            text-decoration: none;
        }
</style>
</head>
<body>
    <div id="urls">
        <a id="href-new" href="{{ url_for('create') }}">Create new link</a>
        <p>Existing Redirects</p>
        <table>
            <thead>
                <tr>
                    <th scope="col">id</th>
                    <th scope="col">shortname</th>
                    <th scope="col">url</th>
                </tr>
            </thead>
            <tbody>
                {% for entry in lonks %}
                <tr>
                    <td>{{ entry.id }}</td>
                    <td>{{ entry.shortname }}</td>
                    <td><a href="{{ entry.url }}">{{ entry.url }}</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
